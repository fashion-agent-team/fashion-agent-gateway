# 앱이 부르는 단 하나의 입구 (약속 문서 2절·3절). 뒤쪽 서비스 주소는 .env.example과 같은 이름의 환경 변수.
server:
  port: 8080

spring:
  application:
    name: fashion-agent-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fashion}
    username: ${SPRING_DATASOURCE_USERNAME:fashion}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # SQL에 스키마 이름을 붙이지 않으므로 연결의 기본 스키마를 account로
      schema: account
  flyway:
    # 공용 DB라서 Flyway 기록 표도 account 스키마 안에 둡니다(다른 서비스와 안 겹치게).
    schemas: account
    default-schema: account
    create-schemas: true
  jackson:
    default-property-inclusion: always
  http:
    clients:
      connect-timeout: 3s
      # agent는 25초 안에 답하도록 돼 있어서(판단 제한) 조금 더 기다립니다. 넘으면 504 upstream_timeout.
      read-timeout: 30s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: agent
              uri: ${AGENT_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/agent/**
            - id: schedule
              uri: ${SCHEDULE_URL:http://localhost:8092}
              predicates:
                - Path=/api/v1/schedules/**

gateway:
  jwt-secret: ${JWT_SECRET:}
  access-ttl: 1h
  refresh-ttl: 30d
  dev-login: ${GATEWAY_DEV_LOGIN:false}
  firebase-project-id: ${FIREBASE_PROJECT_ID:}
  requests-per-minute: 30
  photos-per-minute: 10
  # 로그인 없이 부르는 /api/v1/auth/*: 기기(IP)당 분당, 계정을 만들 수 있는 /dev·/login 전체 합쳐 분당
  auth-per-minute: ${GATEWAY_AUTH_PER_MINUTE:10}
  signups-per-minute: ${GATEWAY_SIGNUPS_PER_MINUTE:30}
  # 하루 전체 로그인(계정을 만들 수 있는 /dev·/login) 한도(2026-11-25 보안 점검)
  signups-per-day: ${GATEWAY_SIGNUPS_PER_DAY:300}
  # 기기 주소를 찾을 때 건너뛸 프록시(사설망·Tailscale·루프백은 기본). 강사님 프록시 바깥 주소 등을 쉼표로.
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
  # 비우지 않으면 개발용 로그인(/api/v1/auth/dev)은 X-Dev-Login-Key 헤더가 이 값과 같아야 받습니다. 앱 빌드에 같은 값을 넣음.
  dev-login-key: ${GATEWAY_DEV_LOGIN_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.fashionagent: INFO
---
# APP_ENV=dev(Docker Compose)면 개발용 로그인을 켭니다. 발표 빌드(prod)에서는 꺼짐.
spring:
  config:
    activate:
      on-profile: dev
gateway:
  dev-login: true
